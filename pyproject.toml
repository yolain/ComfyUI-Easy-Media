[project]
name = "comfyui-easy-media"
description = "A ComfyUI custom node package for streamlined media loading and video pipeline assembly. Provides intuitive nodes that simplify media resource loading with user-friendly parameters, making it easier to build and configure video processing workflows."
version = "1.3.1"
license = { file = "LICENSE" }
dependencies = []

[project.urls]
Repository = "https://github.com/yolain/ComfyUI-Easy-Media"
#  Used by Comfy Registry https://comfyregistry.org

[tool.comfy]
PublisherId = "yolain"
DisplayName = "ComfyUI-Easy-Media"
Icon = ""

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
norecursedirs = [".git", "nodes", "utils", "modules", "frontend", "example_workflows"]

